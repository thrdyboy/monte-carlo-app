data:
  raw_dir: "data/raw/"
  processed_path: "data/processed/simulations_result.csv"
  default_sheet_name: 0

monte_carlo:
  num_simulations: 5000
  forecast_years: 5
  random_seed: 42

columns:
  index: "Tahun"
  months:
    - "Jan"
    - "Feb"
    - "Mar"
    - "Apr"
    - "Mei"
    - "Jun"
    - "Jul"
    - "Agu"
    - "Sep"
    - "Okt"
    - "Nov"
    - "Des"

runoff:
  curve_number: 75
  river_basin_area: 58.87


database:
  host: "warehouse-postgres"
  port: 5432
  schema: "public"

minio:
  endpoint: "minio:9000"
  bucket_parquet: "mc-parquet"
  bucket_plots: "mc-plots"
  secure: false